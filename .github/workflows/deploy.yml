name: Deploy Runtime Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Stamp and verify the built homepage
        run: |
          test -s dist/index.html
          test -d dist/assets
          sed -i "s/navy-hero-mega-accordion-20261121/${GITHUB_SHA}/" dist/index.html
          grep -Fq "${GITHUB_SHA}" dist/index.html
          echo "Build contains revision ${GITHUB_SHA}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload build files
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Wait for uploaded Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 15); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)"
            echo "Indexed Pages artifacts: ${count} (attempt ${attempt})"
            if [ "${count}" = "1" ]; then
              sleep 3
              exit 0
            fi
            sleep 6
          done
          echo "::error::The github-pages artifact did not become available for this run."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Confirm that GitHub Pages serves this commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Checking published site: ${PAGE_URL}"
          for attempt in $(seq 1 12); do
            published="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${PAGE_URL}?revision=${GITHUB_SHA}" || true)"
            if printf '%s' "${published}" | grep -Fq "${GITHUB_SHA}"; then
              echo "Published site now serves commit ${GITHUB_SHA}"
              exit 0
            fi
            echo "Site not yet updated (attempt ${attempt}/12)"
            sleep 8
          done
          echo "::error::Published site does not contain the current commit. Check GitHub Pages settings and deployment logs."
          exit 1

      - name: Confirm live JavaScript contains the latest Activities content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import re
          import urllib.parse
          import urllib.request

          url = os.environ["PAGE_URL"] + "?revision=" + os.environ["GITHUB_SHA"]
          with urllib.request.urlopen(url, timeout=20) as response:
              html = response.read().decode("utf-8")
          match = re.search(r'<script\b[^>]*\bsrc="([^"]+\.js)"', html)
          if not match:
              raise SystemExit("Could not locate the public JavaScript entrypoint.")
          js_url = urllib.parse.urljoin(url, match.group(1))
          request = urllib.request.Request(js_url, headers={"Cache-Control": "no-cache"})
          with urllib.request.urlopen(request, timeout=20) as response:
              javascript = response.read().decode("utf-8")
          required = ("기초부터 탄탄히.", "18:00–18:50", "19:00–19:50", "배움을 실제 경험으로.", "runtime-team-project-hq.webp", "runtime-cert-study-hq.webp")
          missing = [text for text in required if text not in javascript]
          if missing:
              raise SystemExit(f"Public JS asset is missing Activities changes: {missing}. URL: {js_url}")
          print(f"Verified published Activities copy and timetable in {js_url}")
          PY

      - name: Verify full-resolution activity photos are published
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import time
          from urllib.request import Request, urlopen

          photos = [
              ('runtime-team-project-hq.webp', (626, 416), '61e198f3c6b7585fed850fd62a237e152f2b8b5b'),
              ('runtime-cert-study-hq.webp', (600, 375), 'b9d9e8131288fff85cd370c337434a7009a7aa12'),
          ]
          for filename, expected_size, expected_hash in photos:
              url = os.environ['PAGE_URL'].rstrip('/') + '/images/' + filename
              for attempt in range(1, 9):
                  try:
                      request = Request(url + '?revision=' + os.environ['GITHUB_SHA'], headers={'Cache-Control': 'no-cache'})
                      with urlopen(request, timeout=20) as response:
                          data = response.read()
                      digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                      assert digest == expected_hash, f'Unexpected file bytes ({digest})'
                      assert data[:4] == b'RIFF' and data[8:16] == b'WEBPVP8 ', 'Not a VP8 WebP'
                      width = int.from_bytes(data[26:28], 'little') & 16383
                      height = int.from_bytes(data[28:30], 'little') & 16383
                      assert (width, height) == expected_size, f'Unexpected dimensions: {width}x{height}'
                      print(f'Published {filename}: {width}x{height} pixels, {len(data)} bytes, Git blob {digest}')
                      break
                  except Exception as error:
                      if attempt == 8:
                          raise
                      print(f'Image not yet current ({filename}, attempt {attempt}): {error}')
                      time.sleep(3)
          PY
